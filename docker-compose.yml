services:

  # ============================================================
  # Jenkins Controller
  # ============================================================
  # Jenkins manages jobs, pipelines, credentials, plugins,
  # build history and console logs.
  #
  # Jenkins communicates with the Docker-in-Docker service
  # using TLS over the private Docker Compose network.
  # ============================================================

  jenkins:

    # Build the custom Jenkins image defined in Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jenkins

    restart: unless-stopped

    environment:

      # Docker daemon used by Jenkins.
      # "docker" is the Compose service name below.
      DOCKER_HOST: tcp://docker:2376

      # TLS certificates generated by Docker-in-Docker.
      DOCKER_CERT_PATH: /certs/client

      # Enable TLS verification.
      DOCKER_TLS_VERIFY: "1"

    ports:

      # Jenkins web interface.
      # For production this should be protected by HTTPS
      # and network-level access restrictions.
      - "8080:8080"

      # Jenkins inbound agent port.
      - "50000:50000"

    volumes:

      # Persistent Jenkins home.
      # Stores jobs, plugins, credentials, configuration
      # and build history.
      - jenkins_home:/var/jenkins_home

      # Read-only access to the DinD TLS client certificates.
      - jenkins-docker-certs:/certs/client:ro

    depends_on:

      # Start the Docker daemon service.
      - docker

    networks:

      # Private network shared with DinD.
      - jenkins-network


  # ============================================================
  # Docker-in-Docker
  # ============================================================
  # Provides an isolated Docker daemon for Jenkins.
  #
  # The Docker daemon is NOT published to the host.
  # Jenkins reaches it through the private Compose network.
  # ============================================================

  docker:

    image: docker:dind

    container_name: jenkins-docker

    restart: unless-stopped

    # Docker-in-Docker requires additional Linux capabilities.
    # This is isolated from the host Docker socket.
    privileged: true

    environment:

      # Enables TLS certificate generation.
      DOCKER_TLS_CERTDIR: /certs

    volumes:

      # Persistent Docker image/container/build storage.
      - docker_data:/var/lib/docker

      # TLS certificates shared with Jenkins.
      - jenkins-docker-certs:/certs/client

    networks:

      # Private network.
      - jenkins-network

    command: --storage-driver=overlay2


# ==============================================================
# Persistent Volumes
# ==============================================================

volumes:

  # Jenkins configuration, plugins, jobs, credentials
  # and build history.
  jenkins_home:

  # Docker-in-Docker image and container data.
  docker_data:

  # TLS certificates shared by Jenkins and DinD.
  jenkins-docker-certs:


# ==============================================================
# Private Network
# ==============================================================

networks:

  # Jenkins and DinD communicate through this network.
  # The Docker daemon is not directly exposed to the host.
  jenkins-network:
